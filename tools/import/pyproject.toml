[project]
name = "palacards-import"
version = "0.1.0"
description = "Pipeline d'import du Wikipédia FR vers la table cards de PalaCards"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.2",
  "mwxml>=0.3.4",
  "pyarrow>=18",
  "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
palacards-import = "palacards_import.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["palacards_import"]

[tool.ruff]
line-length = 110
