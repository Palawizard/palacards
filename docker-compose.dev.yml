# Postgres local pour le développement : `pnpm db:up`
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: palacards-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palacards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-palacards}
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata-dev:
