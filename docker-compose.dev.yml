# Postgres local pour le développement : `pnpm db:up`
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: palacards-postgres-dev
    # Mêmes réglages mémoire que la prod (docker-compose.yml) : le benchmark mesure la vraie configuration.
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=512MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palacards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-palacards}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata-dev:
