# Stack de production sur vm-apps : /opt/dockpanel/stacks/palacards/
# Caddy route /palacards/api/* et /palacards/socket.io/* -> palacards-api, /palacards/* -> palacards-web.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: palacards-postgres
    restart: unless-stopped
    env_file: .env
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 2g
    logging: *logging
    networks: [palacards]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: palacards-api:0.1.0
    container_name: palacards-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BASE_PATH: /palacards
    depends_on: [postgres]
    mem_limit: 512m
    logging: *logging
    networks: [palacards, caddy]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: palacards-web:0.1.0
    container_name: palacards-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on: [api]
    mem_limit: 512m
    logging: *logging
    networks: [caddy]

networks:
  palacards: {}
  caddy:
    external: true
    # Adapter au nom du réseau Docker de ta stack Caddy sur vm-apps
    name: caddy
