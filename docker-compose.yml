# Stack de production sur vm-apps : /opt/dockpanel/stacks/palacards/
# Caddy route /palacards/api/* et /palacards/socket.io/* -> palacards-api, /palacards/* -> palacards-web.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: palacards-postgres
    restart: unless-stopped
    env_file: .env
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=512MB
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    networks: [palacards]

  # Migrations Drizzle à chaque démarrage de la stack (idempotent), avant l'API.
  migrate:
    image: palacards-api:0.1.0
    container_name: palacards-migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    working_dir: /repo/packages/db
    command: ["node", "dist/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    logging: *logging
    networks: [palacards]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: palacards-api:0.1.0
    container_name: palacards-api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BASE_PATH: /palacards
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/palacards/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging
    networks: [palacards, caddy]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: palacards-web:0.1.0
    container_name: palacards-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/palacards/login || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging: *logging
    networks: [caddy]

networks:
  palacards: {}
  caddy:
    external: true
    # Adapter au nom du réseau Docker de ta stack Caddy sur vm-apps
    name: caddy
