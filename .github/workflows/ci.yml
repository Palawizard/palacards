# Intégration continue : build, typecheck, lint, tests (Vitest sur Postgres) et parcours Playwright,
# plus les tests du pipeline d'import Python.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Build, typecheck, lint, tests, E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: palacards
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: palacards
        # Même port que le Postgres de dev (DATABASE_URL de .env.example).
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U palacards -d palacards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5

      # Version lue dans package.json (packageManager: pnpm@10.28.0).
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Environnement (.env.example)
        run: cp .env.example .env

      - name: Dépendances
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatage (Prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Tests (Vitest, base palacards_test)
        run: pnpm test

      - name: Navigateur Playwright
        run: pnpm --filter @palacards/e2e exec playwright install --with-deps chromium

      - name: E2E (Playwright, base palacards_e2e)
        run: pnpm e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  import:
    name: Pipeline d'import (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: palacards
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: palacards
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U palacards -d palacards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: tools/import
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/import/pyproject.toml

      - name: Dépendances
        run: pip install -e ".[dev]"

      - name: Tests
        # DATABASE_URL : vérifie aussi dans Postgres (numeric) la formule des paliers de finish_card_load.
        env:
          DATABASE_URL: postgres://palacards:change-me@localhost:5433/palacards
        run: pytest -q
