# Suite d'une branche de suggestion : Palawi répond dans la pull request par un commentaire qui commence par
# « @claude » (choix d'une option, correction…). Claude reprend la branche et commite ; le workflow vérifie le
# périmètre, pousse la branche (la PR se met à jour), la CI la revérifie et Discord prévient.
name: Suggestion (suite)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  followup:
    name: Claude reprend la branche
    # Dépôt public : seul le propriétaire du dépôt peut solliciter Claude, et seulement sur une pull request.
    if: >-
      github.event.sender.login == github.repository_owner &&
      (github.event.issue.pull_request || github.event.pull_request) &&
      contains(github.event.comment.body || github.event.review.body || '', '@claude')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    concurrency:
      group: suggestion-followup-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      suggestion: ${{ steps.meta.outputs.suggestion }}
      branch: ${{ steps.meta.outputs.branch }}
      pr: ${{ steps.meta.outputs.pr }}
      pushed: ${{ steps.push.outputs.pushed }}
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: palacards
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: palacards
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U palacards -d palacards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Pull request de suggestion ?
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          branch=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,baseRefName,state \
            -q 'select(.baseRefName == "dev" and .state == "OPEN") | .headRefName')
          if [[ ! "$branch" =~ ^(feat|fix)/suggestion-([0-9]+)$ ]]; then
            echo "::notice::Pas une pull request de suggestion ouverte vers dev : rien à faire."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "suggestion=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.meta.outputs.skip != 'true'
        with:
          ref: ${{ steps.meta.outputs.branch }}
          fetch-depth: 0

      - name: Point de départ
        id: start
        if: steps.meta.outputs.skip != 'true'
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compte rendu (reprise)
        if: steps.meta.outputs.skip != 'true'
        uses: ./.github/actions/suggestion-report
        with:
          suggestion: ${{ steps.meta.outputs.suggestion }}
          payload: '{"status":"running"}'
          api: ${{ vars.AUTOMATION_API_URL }}
          token: ${{ secrets.AUTOMATION_TOKEN }}

      - uses: ./.github/actions/suggestion-setup
        if: steps.meta.outputs.skip != 'true'

      - name: Claude reprend la branche
        if: steps.meta.outputs.skip != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Commits signés github-actions[bot] (pas d'identité d'IA dans l'historique de la branche).
          bot_name: github-actions[bot]
          bot_id: "41898283"
          claude_args: >-
            --model opus
            --max-turns 200
            --append-system-prompt "Tu travailles sur une branche de suggestion de PalaCards : lis puis suis .claude/skills/build-suggestion/SKILL.md (mode « suite dans la pull request »)."
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,TodoWrite,Bash(pnpm:*),Bash(node:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(git log:*),Bash(git show:*),Bash(git restore:*),Bash(ls:*),Bash(find:*),Bash(grep:*),Bash(rg:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(mkdir:*),Bash(sed:*),Bash(sort:*),Bash(.claude/skills/impeccable/scripts/impeccable:*)"
            --disallowedTools "Bash(curl:*),Bash(wget:*),Bash(gh:*),Bash(git push:*),Bash(/home/runner/work/_actions/anthropics/claude-code-action/v1/scripts/git-push.sh:*),WebFetch,WebSearch"

      - name: Rien hors du périmètre
        if: steps.meta.outputs.skip != 'true'
        run: |
          git fetch -q origin dev
          bad=$(git diff --name-only origin/dev...HEAD | grep -E '^(\.github/|deploy/|docker/|\.githooks/|docker-compose[^/]*\.ya?ml$|\.env|\.claude/settings)' || true)
          if [ -n "$bad" ]; then
            echo "::error::Fichiers interdits modifiés : $bad"
            exit 1
          fi

      # Seul chemin vers GitHub : Claude n'a pas le droit de pousser (outils refusés ci-dessus), le workflow pousse
      # après le contrôle du périmètre. Avec RELEASE_TOKEN, la CI de la pull request se relance sur le nouveau commit
      # (un push du GITHUB_TOKEN ne déclenche aucun workflow) ; repli sur le GITHUB_TOKEN sinon.
      - name: Pousser la branche
        id: push
        if: steps.meta.outputs.skip != 'true'
        env:
          BRANCH: ${{ steps.meta.outputs.branch }}
          START: ${{ steps.start.outputs.sha }}
          OWNER_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          # claude-code-action remet la configuration de Claude de la branche par défaut (.claude, CLAUDE.md…) dans
          # l'arbre de travail, par sécurité : ce ne sont pas des changements de Claude, on revient à la branche.
          for p in .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky; do
            git checkout -q HEAD -- "$p" 2>/dev/null || true
          done
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            git status --short --untracked-files=no
            echo "::error::Modifications non commitées : elles seraient perdues. Rien n'est poussé."
            exit 1
          fi
          head=$(git rev-parse HEAD)
          if [ "$head" = "$START" ]; then
            echo "::notice::Aucun nouveau commit : la branche ne change pas."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git log --oneline "$START..HEAD"
          if [ -n "$OWNER_TOKEN" ] && git -c http.https://github.com/.extraheader= \
              push "https://x-access-token:${OWNER_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"; then
            :
          else
            [ -z "$OWNER_TOKEN" ] || echo "::warning::Push refusé avec RELEASE_TOKEN : push par le bot (la CI de la PR ne se relancera pas)."
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Filet de sécurité : si le push échoue, le travail de Claude reste téléchargeable (patchs) pendant 7 jours.
      - name: Sauvegarde des commits non poussés
        if: failure() && steps.start.outputs.sha != ''
        env:
          START: ${{ steps.start.outputs.sha }}
        run: |
          mkdir -p .automation/patches
          git format-patch -q -o .automation/patches "$START..HEAD" || true
          git diff HEAD > .automation/patches/non-commite.diff || true
      - uses: actions/upload-artifact@v6
        if: failure() && steps.start.outputs.sha != ''
        with:
          name: commits-non-pousses
          path: .automation/patches
          retention-days: 7
          if-no-files-found: ignore

  ci:
    name: CI de la branche
    needs: followup
    if: needs.followup.outputs.pushed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.followup.outputs.branch }}

  report:
    name: Compte rendu
    needs: [followup, ci]
    if: always() && needs.followup.outputs.suggestion != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - name: Bilan
        id: payload
        env:
          FOLLOWUP: ${{ needs.followup.result }}
          CI: ${{ needs.ci.result }}
          PUSHED: ${{ needs.followup.outputs.pushed }}
          PR: ${{ needs.followup.outputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$FOLLOWUP" = success ] && [ "$PUSHED" = true ]; then
            payload=$(jq -cn --arg ci "$CI" --argjson pr "$PR" --arg run "$RUN_URL" \
              '{status: "ready", ciConclusion: $ci, prNumber: $pr, runUrl: $run}')
          elif [ "$FOLLOWUP" = success ] || [ "$FOLLOWUP" = cancelled ]; then
            # Rien de poussé (Claude n'a rien commité, ou reprise annulée) : la PR reste telle quelle.
            payload=$(jq -cn --argjson pr "$PR" --arg run "$RUN_URL" --arg why "$FOLLOWUP" \
              '{status: "ready", unchanged: (if $why == "cancelled" then "cancelled" else "no_commit" end), prNumber: $pr, runUrl: $run}')
          else
            payload=$(jq -cn --argjson pr "$PR" --arg run "$RUN_URL" '{status: "failed", prNumber: $pr, runUrl: $run}')
          fi
          echo "json=$payload" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/suggestion-report
        with:
          suggestion: ${{ needs.followup.outputs.suggestion }}
          payload: ${{ steps.payload.outputs.json }}
          api: ${{ vars.AUTOMATION_API_URL }}
          token: ${{ secrets.AUTOMATION_TOKEN }}
